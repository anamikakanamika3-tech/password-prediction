
<!DOCTYPE html>
<html>
<head>
    <title>Password Strength Prediction</title>

    <link rel="stylesheet"
    href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>Password Strength Prediction</h1>

    <p>Enter your password to check its strength</p>

    <form action="/predict" method="POST">

        <input
            type="password"
            name="password"
            placeholder="Enter your password"
            required
        >

        <button type="submit">Check Strength</button>

    </form>

    {% if prediction %}
        <h2>Predicted Strength: {{ prediction }}</h2>
    {% endif %}

</div>

</body>
</html>
